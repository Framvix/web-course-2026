<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Симон говорит</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <h1>Симон говорит</h1>
        <p>Запомните подсветки и повторите последовательность.</p>
        <button id="start" type="button">Старт</button>
        <p>Уровень: <span id="level">0</span></p>
        <p id="status" role="status">Нажмите «Старт».</p>
        <div class="board" role="group" aria-label="Игровые кнопки">
            <button class="color-button red" type="button" aria-label="Красный"></button>
            <button class="color-button blue" type="button" aria-label="Синий"></button>
            <button class="color-button green" type="button" aria-label="Зелёный"></button>
            <button class="color-button yellow" type="button" aria-label="Жёлтый"></button>
        </div>
    </main>
</body>
</html>
