<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Быки и коровы</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <h1>Быки и коровы</h1>
        <p>Угадайте четыре разные цифры. Первая может быть нулём. Бык — цифра на своём месте, корова — на другом.</p>
        <form id="guess-form" novalidate>
            <label for="guess-input">Ваша комбинация</label>
            <div class="guess-row">
                <input id="guess-input" type="text" inputmode="numeric" autocomplete="off" aria-describedby="message">
                <button id="check-button" type="submit">Проверить</button>
            </div>
        </form>
        <p id="message" role="status"></p>
        <p>Попыток: <span id="attempts">0</span></p>
        <button id="new-game" type="button">Новая игра</button>
        <h2>История попыток</h2>
        <ol id="history"></ol>
    </main>
</body>
</html>
