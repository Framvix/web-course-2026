<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Список задач</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <h1>Список задач</h1>
        <form id="task-form">
            <label for="task-input">Новая задача</label>
            <div class="add-task">
                <input id="task-input" type="text" autocomplete="off">
                <button type="submit">Добавить</button>
            </div>
        </form>
        <p>Осталось: <span id="remaining">0</span> · Выполнено: <span id="completed">0</span></p>
        <div class="filters" aria-label="Фильтры задач">
            <button type="button" data-filter="all" aria-pressed="true">Все</button>
            <button type="button" data-filter="active" aria-pressed="false">Активные</button>
            <button type="button" data-filter="completed" aria-pressed="false">Завершённые</button>
        </div>
        <ul id="task-list"></ul>
    </main>
</body>
</html>
